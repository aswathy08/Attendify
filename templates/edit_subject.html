<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Subject - Attendify</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .page-content {
            padding: 30px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
        }

        .page-header p {
            color: #6b7280;
            margin-top: 6px;
        }

        .edit-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            max-width: 700px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .save-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .save-btn:hover {
            background: #4338ca;
        }

        .cancel-btn {
            background: #f3f4f6;
            color: #374151;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .cancel-btn:hover {
            background: #e5e7eb;
        }

        .nav-item.active {
            background: #eef2ff;
            color: #4f46e5;
        }
    </style>
</head>

<body>

<div class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <h2>Attendify</h2>
        </div>

        <nav>

            <a href="/dashboard" class="nav-item">
                <span class="nav-icon">⌂</span>
                <span>Dashboard</span>
            </a>

            <a href="/students" class="nav-item">
                <span class="nav-icon">♙</span>
                <span>Students</span>
            </a>

            <a href="/subjects" class="nav-item active">
                <span class="nav-icon">▣</span>
                <span>Subjects</span>
            </a>

            <a href="#" class="nav-item">
                <span class="nav-icon">✓</span>
                <span>Attendance</span>
            </a>

            <a href="#" class="nav-item">
                <span class="nav-icon">▤</span>
                <span>Reports</span>
            </a>

        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <div class="page-content">

            <div class="page-header">

                <h1>Edit Subject</h1>

                <p>
                    Update the subject details below.
                </p>

            </div>


            <div class="edit-card">

                <form
                    action="/subjects/edit/{{ subject.subject_id }}"
                    method="POST"
                >

                    <div class="form-group">

                        <label>Subject Code</label>

                        <input
                            type="text"
                            name="subject_code"
                            value="{{ subject.subject_code }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Subject Name</label>

                        <input
                            type="text"
                            name="subject_name"
                            value="{{ subject.subject_name }}"
                            required
                        >

                    </div>


                    <div class="button-group">

                        <button
                            type="submit"
                            class="save-btn"
                        >
                            Save Changes
                        </button>

                        <a
                            href="/subjects"
                            class="cancel-btn"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

</body>
</html>
